name: WebdriverIO CI

on:
  push:
    branches: [ aleena]
  pull_request:
    branches: [aleena]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run WebdriverIO tests
      run: npx wdio run wdio.conf.js
